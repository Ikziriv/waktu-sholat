<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Waktu Sholat</title>
<style>
  body { background: #0a0e1a; color: #e8e4d9; font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  .loader { text-align: center; }
  .spinner { width: 32px; height: 32px; border: 2px solid #2a3148; border-top-color: #c9a961; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <p>Memulai server...</p>
</div>
<script>
// Redirect to the Go HTTP server running in-process.
// Small delay to ensure the server has started in OnStartup.
setTimeout(function() {
  window.location.href = "http://127.0.0.1:9090/";
}, 500);
</script>
</body>
</html>
